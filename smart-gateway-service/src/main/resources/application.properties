spring.application.name=smart-gateway-service

server.port = 8080

info.app.name = Smart Gateway Service
info.app.description = Custom API gateway for routing, security and traffic management
spring.output.ansi.enabled=ALWAYS

management.api.username=${ROUTEX_GATEWAY_USERNAME:gateway-service}
management.api.password=${ROUTEX_GATEWAY_PASSWORD:gateway123}
management.api.base-url=${ROUTEX_MANAGEMENT_URL:http://localhost:8081}

gateway.kafka.configuration-topic=${ROUTEX_CONFIGURATION_TOPIC:gateway-configuration_events}
gateway.kafka.configuration-group=${ROUTEX_CONFIGURATION_GROUP:smart-gateway-configuration}

spring.kafka.bootstrap-servers=${ROUTEX_KAFKA_SERVERS:localhost:9092}

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

